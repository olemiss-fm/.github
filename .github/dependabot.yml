# Dependabot configuration for the .github org config repo
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Cadence retuned 2026-10-29 (fewer bump PRs, so fewer CI runs and deploys):
#   - app libraries stay WEEKLY.
#   - docker, github-actions and CI-only tooling run MONTHLY: their bumps
#     change CI or the base image, rarely fix anything, and each one cost a
#     full CI run.
#   - security updates are unchanged: they ignore schedule, cooldown and
#     grouping, and still open as soon as an advisory lands.

version: 2
updates:
  # GitHub Actions - auto-monitored if any workflows are added in the future
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    reviewers:
      - "olemiss-fm/maintainers"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
