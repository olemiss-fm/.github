# Lint config for the quality ratchet (see docs/quality-gates.md). The gate judges only
# lines a PR adds or edits, so the existing backlog is not fixed here.
[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["secrets"]

[tool.ruff.lint]
select = ["E", "F", "B", "S", "SIM", "C4", "PERF", "UP", "RET", "PIE", "C90"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
"**/conftest.py" = ["S101"]
